# DEV - NATS JetStream + Typesense
services:
  nats:
    image: nats:2.15-alpine
    container_name: nats
    restart: unless-stopped
    user: "1000:1000"
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD}
    ports:
      - "4222:4222"
      - "127.0.0.1:8222:8222"   # monitoring, hanya dari VM ini
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - /data/nats:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  typesense:
    image: typesense/typesense:30.2
    container_name: typesense
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    ports:
      - "8108:8108"
    volumes:
      - /data/typesense:/data
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
